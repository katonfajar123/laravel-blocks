name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            php: '8.2'
            testbench: '^9.17'
            dependencies: lowest
          - laravel: '11'
            php: '8.3'
            testbench: '^9.17'
            dependencies: highest
          - laravel: '11'
            php: '8.4'
            testbench: '^9.17'
            dependencies: highest
          - laravel: '12'
            php: '8.2'
            testbench: '^10.11'
            dependencies: highest
          - laravel: '12'
            php: '8.3'
            testbench: '^10.11'
            dependencies: highest
          - laravel: '12'
            php: '8.4'
            testbench: '^10.11'
            dependencies: highest
          - laravel: '12'
            php: '8.5'
            testbench: '^10.11'
            dependencies: highest
          - laravel: '13'
            php: '8.3'
            testbench: '^11.1'
            dependencies: highest
          - laravel: '13'
            php: '8.4'
            testbench: '^11.1'
            dependencies: highest
          - laravel: '13'
            php: '8.5'
            testbench: '^11.1'
            dependencies: highest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Select Laravel compatibility lane
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Install current dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run package tests
        run: composer test

  quality:
    name: Quality, bundle, and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP formatting check
        run: composer lint

      - name: Run PHP static analysis
        run: composer analyse

      - name: Run PHP tests
        run: composer test

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -- --run

      - name: Build committed distribution
        run: npm run build

      - name: Verify committed distribution is current
        run: git diff --exit-code -- dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression suite
        run: npm run test:browser
